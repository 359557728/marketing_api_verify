name: Build Rust Program on Rocky Linux 9

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Rocky Linux 9
        uses: addnab/docker-run-action@v3
        with:
          image: rockylinux:9
          options: -v ${{ github.workspace }}:/app:rw -w /app
          run: |
            # Update and install development tools and dependencies using dnf
            dnf clean all
            dnf update -y
            dnf groupinstall -y "Development Tools"
            dnf install -y git wget tar gcc gcc-c++ make openssl-devel

            # Install Rust
            curl https://sh.rustup.rs -sSf | sh -s -- -y
            source $HOME/.cargo/env
            
            # Format Code
            cargo fmt --all --check

            # Verify Rust installation
            rustc --version
            cargo --version

            # Build the Rust program
            cargo build --release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-build
          path: target/release/marketing_api_verify
